site_name: missingfcup
site_description: Interactive Plotly visualizations and metrics for exploring missing data in pandas DataFrames
repo_url: https://github.com/matiasmoon/missingfcup
repo_name: matiasmoon/missingfcup
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Plots: plots.md
  - Parameters: parameters.md
  - Choosing a measure: measures.md
  - API reference: api.md
  - Analyses:
      - Overview: notebooks/README.md
      - Titanic (univariate): notebooks/titanic/analysis_uni.ipynb
      - Titanic: notebooks/titanic/analysis_multi.ipynb
      - Breast cancer: notebooks/breast_cancer/analysis_multi.ipynb
      - Contraceptive method: notebooks/contraceptive_method/analysis_multi.ipynb
      - Student performance: notebooks/student_performance/analysis_multi.ipynb
      - Default of credit card clients: notebooks/default_credit/analysis_multi.ipynb
      - Mechanism variants: notebooks/mechanism_variants/analysis_variants.ipynb

plugins:
  - search
  # Renders the notebooks in notebooks/ as pages. execute is off on purpose: the
  # committed outputs are the record of what the analyses produced, and re-running
  # them here would need the dataset dependencies and several minutes per build.
  # Because the site is served as ordinary HTML, the Plotly figures stay interactive,
  # which the .ipynb preview on github.com cannot do -- it strips the scripts.
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # The docstrings in this package are numpydoc style.
            docstring_style: numpy
            docstring_section_style: table
            # MissingData gets its metrics from mixins, so inherited members
            # have to be pulled in or the reference would be nearly empty.
            inherited_members: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 3
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
