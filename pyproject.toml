[project]
name = "missingfcup"
# Read from missingfcup.__version__ (see [tool.setuptools.dynamic]) so the version
# has a single home instead of being repeated here and in the package.
dynamic = ["version"]
description = "Interactive Plotly visualizations and metrics for exploring missing data in pandas DataFrames"
authors = [
    { name = "Matias Luna", email = "matiasortizluna.contacto@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

# Every floor here is exercised by the `minimums` job in CI, not guessed.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    # 6.1.1 is the lowest plotly that kaleido 1.x accepts, and the lowest that has
    # the axis properties the UpSet plot sets.
    "plotly>=6.1.1",
    "scipy>=1.10",
    # Renders figures to PNG. Fetches a browser on first export; `plotly_get_chrome -y`
    # does it up front.
    "kaleido>=1.0"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

keywords = [
    "missing-data",
    "visualization",
    "plotly",
    "data-science",
    "pandas"
]

[project.urls]
Homepage = "https://github.com/matiasmoon/missingfcup"
Source = "https://github.com/matiasmoon/missingfcup"
"Bug Tracker" = "https://github.com/matiasmoon/missingfcup/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# For notebooks/, not examples/ — the example scripts need only the core package.
# jupyter is included because the notebooks import IPython and cannot run without it.
# The floors record the versions the committed analyses were produced with.
notebooks = [
    "jupyter>=1.0",
    "seaborn>=0.12",
    "mdatagen>=0.2",
    "scikit-learn>=1.3",
    "ucimlrepo>=0.0.7",
]
# ruff is listed because mkdocstrings uses it to format rendered signatures.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
missingfcup = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "missingfcup.__version__" }

[build-system]
# setuptools 77 is the floor for PEP 639, which lets `license` be a plain SPDX string.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# UP (pyupgrade) is left off on purpose: it rewrites typing to 3.10+ syntax, but the
# package supports 3.9. E501 is the formatter's job.
select = ["E", "W", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
# src layout: put the package on sys.path so pytest works without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
