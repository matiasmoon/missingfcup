[project]
name = "missingfcup"
version = "0.1.0"
description = "Interactive Plotly visualizations and metrics for exploring missing data in pandas DataFrames"
authors = [
    { name = "Matias Luna", email = "matiasortizluna.contacto@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.20",
    "scipy>=1.10",
    "kaleido>=0.2,<1.0"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

keywords = [
    "missing-data",
    "visualization",
    "plotly",
    "data-science",
    "pandas"
]

[project.urls]
Homepage = "https://github.com/matiasmoon/missingfcup"
Source = "https://github.com/matiasmoon/missingfcup"
"Bug Tracker" = "https://github.com/matiasmoon/missingfcup/issues"

[project.optional-dependencies]
# Tests need pytest; ruff lints and formats. The core deps cover the rest.
dev = ["pytest>=7.0", "ruff>=0.6"]
# Extra packages the example notebooks use (not needed to run the library).
examples = ["seaborn>=0.12", "mdatagen", "scikit-learn>=1.3", "ucimlrepo", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
missingfcup = ["py.typed"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear. UP (pyupgrade) is left
# off on purpose: it rewrites typing to 3.10+ syntax, but the package supports 3.9.
select = ["E", "W", "F", "I", "B"]
# Line length is enforced by the formatter, which leaves long strings/comments alone.
ignore = ["E501"]
